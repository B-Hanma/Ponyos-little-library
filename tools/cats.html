<!doctype html><html><head><meta charset="utf-8"><title>cats</title>
<link rel="stylesheet" href="/styles/tokens.css">
<link rel="stylesheet" href="/styles/base.css">
<link rel="stylesheet" href="/styles/personality.css">
<style>
  /* Every kitten mood at once. A character drawn from primitives is only
     as good as its worst expression, and the only way to find that one is
     to look at all of them side by side. */
  body { padding: 24px; background: var(--bg); color: var(--text); font-family: var(--font-body); }
  h1 { font-family: var(--font-display); margin-bottom: 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  figure { margin: 0; display: grid; justify-items: center; gap: 6px;
           padding: 14px 6px; border-radius: 12px; background: var(--surface); }
  figcaption { font-family: var(--font-mono); font-size: 12px; color: var(--accent-text); }
  .sizes { display: flex; align-items: flex-end; gap: 18px; margin: 26px 0 30px;
           padding: 18px; border-radius: 12px; background: var(--surface); }
</style></head><body>
<h1>The kitten</h1>
<div class="sizes" id="sizes"></div>
<div class="grid" id="grid"></div>
<script type="module">
import { cat, CAT_MOODS } from '/src/ui/cat.js';
document.getElementById('sizes').innerHTML =
  [40, 56, 78, 104, 150].map((s) => `<div>${cat('wave', { size: s, className: 'cat--alive' })}<div style="font:11px monospace;text-align:center">${s}px</div></div>`).join('');
document.getElementById('grid').innerHTML = CAT_MOODS.map((m) =>
  `<figure>${cat(m, { size: 110, className: 'cat--alive' })}<figcaption>${m}</figcaption></figure>`).join('');
document.title = 'ready';
</script></body></html>
