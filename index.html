<!doctype html>
<html lang="en" data-theme="ocean" data-mood="tide">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ponyo's Little Library</title>
  <meta name="description" content="A small, private library made for one reader." />
  <meta name="color-scheme" content="dark light" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/layout.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/views.css" />
  <link rel="stylesheet" href="styles/scenes.css" />
  <link rel="stylesheet" href="styles/landing.css" />
  <link rel="stylesheet" href="styles/worlds.css" />
  <link rel="stylesheet" href="styles/library-mode.css" />
  <link rel="stylesheet" href="styles/personality.css" />
  <link rel="stylesheet" href="styles/animations.css" />
</head>
<body>
  <!-- Ambient background: sits behind everything, re-tints with the current mood -->
  <div class="ambient" aria-hidden="true">
    <div class="ambient__wash"></div>
    <div class="ambient__glow ambient__glow--a"></div>
    <div class="ambient__glow ambient__glow--b"></div>
    <div class="ambient__grain"></div>
  </div>

  <a class="skip-link" href="#main">Skip to the books</a>

  <!-- ─────────────  LANDING  ─────────────
       Built by src/ui/landing.js before the app renders, and removed on
       the way in. It is deliberately NOT a view: keeping it outside the
       router is what makes "every reload starts here" true by
       construction rather than by a rule somebody has to remember. -->
  <section id="landing" aria-label="Welcome"></section>

  <!-- ─────────────  APP  ───────────── -->
  <div id="app" class="app" hidden>
    <!-- ─────────────  SIDEBAR  ─────────────
         Her library's own spine, not an admin rail. Fixed on desktop,
         replaced by the tab bar on touch sizes. -->
    <aside class="rail" aria-label="Her library">
      <button class="rail__btn rail__btn--home" type="button" data-action="landing">
        <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>
        <span>Landing</span>
      </button>

      <span class="rail__rule" aria-hidden="true"></span>

      <button class="rail__btn" type="button" data-nav="library">
        <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="M4 5h6v14H4zM14 5h6v14h-6zM4 9h6M14 9h6"/></svg>
        <span>Shelves</span>
      </button>
      <button class="rail__btn" type="button" data-nav="building">
        <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="M3 20h18M5 20V9l7-5 7 5v11M9 20v-5h6v5M9 11h2M13 11h2"/></svg>
        <span>Library mode</span>
      </button>
      <button class="rail__btn" type="button" data-nav="dna">
        <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="M7 3c0 5 10 5 10 10S7 18 7 21M17 3c0 5-10 5-10 10s10 5 10 8M8 7h8M8 17h8"/></svg>
        <span>Reading DNA</span>
      </button>
      <button class="rail__btn" type="button" data-nav="stats">
        <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span>Numbers</span>
      </button>

      <span class="rail__rule" aria-hidden="true"></span>

      <button class="rail__btn" type="button" data-action="surprise">
        <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1.3" fill="currentColor"/><circle cx="15" cy="15" r="1.3" fill="currentColor"/><circle cx="15" cy="9" r="1.3" fill="currentColor"/><circle cx="9" cy="15" r="1.3" fill="currentColor"/></svg>
        <span>Surprise me</span>
      </button>
      <button class="rail__btn" type="button" data-action="mood">
        <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M9 10h.01M15 10h.01M8.5 14.5c1 1.4 2.2 2 3.5 2s2.5-.6 3.5-2"/></svg>
        <span>Mood</span>
      </button>
      <button class="rail__btn" type="button" data-nav="settings">
        <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6M18.4 18.4l-1.6-1.6M7.2 7.2 5.6 5.6"/></svg>
        <span>Yours</span>
      </button>

      <div class="rail__foot" aria-hidden="true">
        <span class="rail__cat" data-rail-cat></span>
        <span class="rail__note">just one more chapter…</span>
      </div>
    </aside>

    <header class="topbar">
      <div class="topbar__row">
        <button class="brand" type="button" data-nav="library" aria-label="Ponyo's Little Library — go to the shelves">
          <svg class="brand__mark" viewBox="0 0 64 64" width="30" height="30" aria-hidden="true">
            <path class="mk-wave" d="M4 40c6 0 6-6 12-6s6 6 12 6 6-6 12-6 6 6 12 6 6-6 8-6" />
            <path class="mk-book" d="M18 12h11a5 5 0 0 1 5 5v15a5 5 0 0 0-5-4H18zM46 12H35a5 5 0 0 0-5 5v15a5 5 0 0 1 5-4h11z" />
          </svg>
          <span class="brand__text">
            <span class="brand__name">Ponyo's</span>
            <span class="brand__sub">little library</span>
          </span>
        </button>

        <div class="search" role="search">
          <svg class="search__icon" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
            <circle cx="11" cy="11" r="7" /><path d="M16.5 16.5 21 21" />
          </svg>
          <input id="search-input" class="search__input" type="search" autocomplete="off"
                 placeholder="Murakami, mystery, that one about the bookshop…" aria-label="Search your library" />
          <button id="search-clear" class="search__clear" type="button" aria-label="Clear search" hidden>&times;</button>
        </div>

        <nav class="topnav" aria-label="Main">
          <button class="topnav__btn" type="button" data-nav="library">Shelves</button>
          <button class="topnav__btn" type="button" data-nav="building">Library mode</button>
          <button class="topnav__btn" type="button" data-nav="dna">Reading DNA</button>
          <button class="topnav__btn" type="button" data-nav="stats">Numbers</button>
          <button class="topnav__btn" type="button" data-nav="settings" aria-label="Settings">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <circle cx="12" cy="12" r="3.2" />
              <path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6M18.4 18.4l-1.6-1.6M7.2 7.2 5.6 5.6" />
            </svg>
          </button>
        </nav>

        <button id="surprise-btn" class="btn btn--surprise" type="button" title="Surprise me">
          <span aria-hidden="true">🎲</span>
          <span>Surprise me</span>
        </button>

        <button id="add-book-btn" class="btn btn--primary btn--add" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          <span>Add a book</span>
        </button>
      </div>
    </header>

    <main id="main" class="main" tabindex="-1">
      <div id="view" class="view"></div>
    </main>

    <nav class="tabbar" aria-label="Main (mobile)">
      <button class="tabbar__btn" type="button" data-nav="library">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 5h6v14H4zM14 5h6v14h-6zM4 9h6M14 9h6"/></svg>
        <span>Shelves</span>
      </button>
      <button class="tabbar__btn" type="button" data-nav="building">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 20h18M5 20V9l7-5 7 5v11M9 20v-5h6v5M9 11h2M13 11h2"/></svg>
        <span>Explore</span>
      </button>
      <button class="tabbar__btn" type="button" data-nav="dna">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M7 3c0 5 10 5 10 10S7 18 7 21M17 3c0 5-10 5-10 10s10 5 10 8M8 7h8M8 17h8"/></svg>
        <span>DNA</span>
      </button>
      <button class="tabbar__btn tabbar__btn--fab" type="button" data-action="surprise" aria-label="Surprise me">
        <span aria-hidden="true" style="font-size:20px;line-height:1">🎲</span>
      </button>
      <button class="tabbar__btn" type="button" data-nav="stats">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span>Numbers</span>
      </button>
      <button class="tabbar__btn" type="button" data-nav="settings">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6M18.4 18.4l-1.6-1.6M7.2 7.2 5.6 5.6"/></svg>
        <span>You</span>
      </button>
    </nav>
  </div>

  <!-- Mounted by JS -->
  <div id="world-announce" aria-hidden="true"></div>
  <div id="mascot-corner" aria-hidden="true"></div>
  <div id="drawer-root"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="false"></div>

  <noscript>
    <p style="padding:2rem;font:1rem/1.6 Georgia,serif">
      This little library needs JavaScript to open its doors.
    </p>
  </noscript>

  <script type="module" src="src/main.js"></script>
</body>
</html>
